<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6c757d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d32f2f"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#f8f9fa"/>

  <!-- Architecture: Users → API Gateway → Lambda → RDS -->
  <g fill="#fff" stroke="#ced4da" stroke-width="2">
    <rect x="16" y="24" width="128" height="100" rx="10"/>
    <rect x="176" y="24" width="128" height="100" rx="10"/>
    <rect x="336" y="24" width="128" height="100" rx="10"/>
  </g>
  <rect x="496" y="24" width="128" height="100" rx="10" fill="#fdecea" stroke="#d32f2f" stroke-width="3"/>

  <g stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)">
    <line x1="146" y1="58" x2="172" y2="58"/>
    <line x1="306" y1="58" x2="332" y2="58"/>
    <line x1="466" y1="58" x2="492" y2="58"/>
  </g>

  <g text-anchor="middle" fill="#212529">
    <text x="80" y="62" font-size="19" font-weight="700">Users</text>
    <text x="80" y="92" font-size="14" fill="#495057">200 → 2,000/s</text>

    <text x="240" y="62" font-size="17" font-weight="700">API Gateway</text>
    <text x="240" y="92" font-size="14" fill="#495057">10K req/s limit</text>

    <text x="400" y="62" font-size="19" font-weight="700">Lambda</text>
    <text x="400" y="92" font-size="14" fill="#495057">+160 cold starts</text>

    <text x="560" y="54" font-size="19" font-weight="700">RDS</text>
    <text x="560" y="100" font-size="14" font-weight="600" fill="#b71c1c">90/90 connections</text>
    <text x="560" y="117" font-size="13" fill="#b71c1c">74 queries waiting</text>
  </g>
  <!-- Connection gauge, full -->
  <rect x="510" y="66" width="100" height="12" rx="3" fill="#d32f2f"/>

  <!-- Rejections flowing back up the chain -->
  <path d="M548 126 Q484 176 418 126" fill="none" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="484" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#d32f2f">too many connections</text>

  <!-- Chart: offered load vs. successful requests -->
  <rect x="210" y="212" width="270" height="88" fill="#d32f2f" fill-opacity="0.18"/>
  <polyline points="56,356 210,356 210,212 480,212 480,356 624,356" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="5 4"/>
  <polyline points="56,356 210,356 210,300 480,300 480,356 624,356" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="56" y1="372" x2="624" y2="372" stroke="#adb5bd" stroke-width="1.5"/>

  <g text-anchor="middle" font-size="13">
    <text x="345" y="206" fill="#495057">2,000 req/s offered</text>
    <text x="345" y="262" font-size="15" font-weight="700" fill="#b71c1c">~1,100/s fail</text>
    <text x="345" y="320" font-weight="600" fill="#2563eb">~900/s succeed</text>
  </g>
  <text x="624" y="390" text-anchor="end" font-size="12" fill="#6c757d">time →</text>
  <text x="56" y="390" font-size="12" fill="#6c757d">requests/s over a 60 s run</text>
</svg>
